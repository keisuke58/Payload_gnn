[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payload-gnn"
version = "0.2.0"
description = "GNN-SHM for JAXA H3 CFRP fairing debonding detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keisuke Nishioka" }]
keywords = ["gnn", "shm", "cfrp", "fairing", "jaxa", "pytorch-geometric"]
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "tensorboard>=2.14.0",
]
quantum = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.13.0",
    "qiskit-algorithms>=0.3.0",
    "qiskit-machine-learning>=0.7.0",
    "qiskit-optimization>=0.6.0",
]
fem = ["fenics-dolfinx>=0.7.0", "jax>=0.4.0", "jaxlib>=0.4.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/keisuke58/Payload_gnn"
Repository = "https://github.com/keisuke58/Payload_gnn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gnn: requires torch-geometric",
]